<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New site: prompt box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500..800&family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400..600&display=swap">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<!-- Route: /new  ·  Yellow (marker) buttons are the ones that spend an AI request. -->
<header class="sticky top-0 z-30 border-b border-border bg-card">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-3 px-4 sm:gap-6 sm:px-6">
    <a href="landing.html" class="flex h-10 shrink-0 items-center gap-2 rounded-md font-display text-[17px] font-bold tracking-tight text-foreground focus-visible:outline-2 focus-visible:outline-offset-4" aria-label="Placard home">
  <span class="grid size-7 place-items-center rounded-md bg-primary" aria-hidden="true">
    <svg viewBox="0 0 16 16" class="size-4"><rect x="3" y="3" width="10" height="2.2" rx="1.1" fill="#ffd43b"/><rect x="3" y="6.9" width="7.5" height="2.2" rx="1.1" fill="#fff"/><rect x="3" y="10.8" width="4.8" height="2.2" rx="1.1" fill="#fff" fill-opacity=".55"/></svg>
  </span>
  <span>Placard</span>
</a>

    <nav aria-label="Main" class="flex items-center gap-1 text-sm font-medium">
      <a href="dashboard.html" class="inline-flex h-10 items-center rounded-md px-3 sm:h-8 bg-accent text-foreground">Sites</a>
      <a href="account.html" class="inline-flex h-10 items-center rounded-md px-3 sm:h-8 text-muted-foreground hover:bg-accent hover:text-foreground">Account</a>
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <a href="account.html" class="hidden items-center gap-2.5 rounded-md px-2 py-1.5 text-sm hover:bg-accent sm:flex" aria-label="7 of 10 AI requests left this month">
        <svg class="lucide shrink-0 size-4 text-muted-foreground" data-icon="sparkles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /><path d="M20 2v4" /><path d="M22 4h-4" /><circle cx="4" cy="20" r="2" /></svg>
        <span class="tabular-nums"><span class="font-semibold">7</span><span class="text-muted-foreground"> of 10 AI requests left</span></span>
        <span class="h-1.5 w-14 overflow-hidden rounded-full bg-muted" aria-hidden="true"><span class="block h-full rounded-full bg-primary" style="width: 70%"></span></span>
      </a>
      <a href="pricing.html" class="hidden h-8 sm:inline-flex items-center rounded-md border border-input bg-card px-3 text-sm font-medium hover:bg-accent">Upgrade</a>
      <button type="button" class="grid size-10 place-items-center rounded-full sm:size-8 bg-[#d6dbe5] text-xs font-semibold text-foreground" aria-label="Account menu">AS</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-2xl px-4 pt-12 pb-20 sm:px-6 sm:pt-16">
  <h1 class="font-display text-4xl font-bold sm:text-5xl">Describe your site</h1>
  <p class="mt-3 text-muted-foreground">A sentence or two is enough. Say what you do, who it’s for and the feel you want.</p>

  <form class="mt-8" onsubmit="event.preventDefault()">
    <div class="rounded-xl border border-input bg-card focus-within:ring-2 focus-within:ring-ring/30">
      <label for="prompt" class="sr-only">Describe your site</label>
      <textarea id="prompt" name="prompt" rows="5" maxlength="1000" class="block w-full resize-none rounded-t-xl bg-transparent px-5 pt-4 text-lg leading-relaxed outline-none placeholder:text-muted-foreground" placeholder="A yoga studio in Pokhara with morning classes, teacher bios and a weekly schedule. Calm and natural."></textarea>
      <div class="flex items-end justify-between gap-4 px-5 pt-2 pb-4">
        <div class="space-y-0.5 text-xs text-muted-foreground">
          <p class="tabular-nums" aria-live="polite">0 / 1,000</p>
          <p>Uses 1 of your 7 AI requests</p>
        </div>
        <div class="flex items-center gap-3">
          <button type="submit" class="inline-flex h-10 items-center gap-2 rounded-md bg-marker px-4 text-sm font-semibold text-marker-foreground hover:bg-marker/85"><svg class="lucide shrink-0 size-4" data-icon="sparkles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /><path d="M20 2v4" /><path d="M22 4h-4" /><circle cx="4" cy="20" r="2" /></svg>Build my site</button>
        </div>
      </div>
    </div>

    <div class="mt-6 grid gap-5 sm:grid-cols-2">
      <div>
        <label for="business" class="text-sm font-medium">Business name <span class="font-normal text-muted-foreground">(optional)</span></label>
        <input id="business" name="businessName" maxlength="80" class="mt-2 h-10 w-full rounded-md border border-input bg-card px-3 text-base sm:text-sm outline-none focus-visible:ring-2 focus-visible:ring-ring/30" placeholder="e.g. Lakeside Yoga">
      </div>
      <div>
        <span id="tone-label" class="text-sm font-medium">Tone <span class="font-normal text-muted-foreground">(optional)</span></span>
        <div class="mt-2 grid grid-cols-4 gap-1 rounded-lg bg-muted p-1 text-sm font-medium" role="radiogroup" aria-labelledby="tone-label">
          <button type="button" role="radio" aria-checked="false" class="h-10 rounded-md sm:h-8 text-muted-foreground hover:text-foreground">Minimal</button>
          <button type="button" role="radio" aria-checked="true" class="h-10 rounded-md sm:h-8 bg-card shadow-sm">Bold</button>
          <button type="button" role="radio" aria-checked="false" class="h-10 rounded-md sm:h-8 text-muted-foreground hover:text-foreground">Playful</button>
          <button type="button" role="radio" aria-checked="false" class="h-10 rounded-md sm:h-8 text-muted-foreground hover:text-foreground">Elegant</button>
        </div>
      </div>
    </div>
  </form>

  <section class="mt-12" aria-labelledby="examples-h">
    <h2 id="examples-h" class="text-sm font-semibold">Try an example</h2>
    <div class="mt-3 grid gap-3">
      <button type="button" class="rounded-xl border border-border bg-card p-4 text-left text-sm leading-relaxed hover:border-input">A small bakery in Patan. Sourdough, cardamom buns and weekend brunch. Warm and friendly.</button>
      <button type="button" class="rounded-xl border border-border bg-card p-4 text-left text-sm leading-relaxed hover:border-input">A plumbing and heating service in Lalitpur. Emergency call-outs, fixed prices and a phone number people can tap.</button>
      <button type="button" class="rounded-xl border border-border bg-card p-4 text-left text-sm leading-relaxed hover:border-input">A family-run guesthouse near Phewa Lake with six rooms, a rooftop café and trekking help.</button>
    </div>
  </section>
</main>
</body>
</html>
