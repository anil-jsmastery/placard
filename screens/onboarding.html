<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding: What are you building?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500..800&family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400..600&display=swap">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<!-- Route: /onboarding  ·  Shown once, right after sign-up. Saves users.use_case. Skip sets use_case = "other". -->
<div class="flex min-h-screen flex-col">
  <header class="flex h-16 items-center px-5 sm:px-8"><a href="landing.html" class="flex h-10 shrink-0 items-center gap-2 rounded-md font-display text-[17px] font-bold tracking-tight text-foreground focus-visible:outline-2 focus-visible:outline-offset-4" aria-label="Placard home">
  <span class="grid size-7 place-items-center rounded-md bg-primary" aria-hidden="true">
    <svg viewBox="0 0 16 16" class="size-4"><rect x="3" y="3" width="10" height="2.2" rx="1.1" fill="#ffd43b"/><rect x="3" y="6.9" width="7.5" height="2.2" rx="1.1" fill="#fff"/><rect x="3" y="10.8" width="4.8" height="2.2" rx="1.1" fill="#fff" fill-opacity=".55"/></svg>
  </span>
  <span>Placard</span>
</a>
</header>
  <main class="flex flex-1 items-start justify-center px-5 pt-10 pb-16 sm:pt-20">
    <form class="w-full max-w-xl" onsubmit="event.preventDefault()">
      <h1 class="font-display text-4xl font-bold sm:text-5xl">What are you building?</h1>
      <p class="mt-3 text-muted-foreground">We’ll show you example prompts that fit.</p>
      <fieldset class="mt-8">
        <legend class="sr-only">Use case</legend>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="flex cursor-pointer items-start gap-3.5 rounded-xl border-2 border-primary bg-card p-4">
            <input type="radio" name="use_case" value="business" class="sr-only" checked>
            <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-primary text-primary-foreground"><svg class="lucide shrink-0 size-5" data-icon="store" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" /><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244" /><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" /></svg></span>
            <span><span class="block font-semibold">Business</span><span class="mt-0.5 block text-sm text-muted-foreground">A shop, café, studio or service</span></span>
          </label>
          <label class="flex cursor-pointer items-start gap-3.5 rounded-xl border-2 border-border bg-card p-4 hover:border-input">
            <input type="radio" name="use_case" value="portfolio" class="sr-only">
            <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-muted"><svg class="lucide shrink-0 size-5" data-icon="palette" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg></span>
            <span><span class="block font-semibold">Portfolio</span><span class="mt-0.5 block text-sm text-muted-foreground">Your work and how to hire you</span></span>
          </label>
          <label class="flex cursor-pointer items-start gap-3.5 rounded-xl border-2 border-border bg-card p-4 hover:border-input">
            <input type="radio" name="use_case" value="event" class="sr-only">
            <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-muted"><svg class="lucide shrink-0 size-5" data-icon="calendar" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg></span>
            <span><span class="block font-semibold">Event</span><span class="mt-0.5 block text-sm text-muted-foreground">A meetup, wedding or launch</span></span>
          </label>
          <label class="flex cursor-pointer items-start gap-3.5 rounded-xl border-2 border-border bg-card p-4 hover:border-input">
            <input type="radio" name="use_case" value="product" class="sr-only">
            <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-muted"><svg class="lucide shrink-0 size-5" data-icon="package" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><polyline points="3.29 7 12 12 20.71 7" /><path d="m7.5 4.27 9 5.15" /></svg></span>
            <span><span class="block font-semibold">Product</span><span class="mt-0.5 block text-sm text-muted-foreground">An app, a gadget or something you sell</span></span>
          </label>
          <label class="flex cursor-pointer items-start gap-3.5 rounded-xl border-2 border-border bg-card p-4 hover:border-input sm:col-span-2">
            <input type="radio" name="use_case" value="other" class="sr-only">
            <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-muted"><svg class="lucide shrink-0 size-5" data-icon="shapes" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z" /><rect x="3" y="14" width="7" height="7" rx="1" /><circle cx="17.5" cy="17.5" r="3.5" /></svg></span>
            <span><span class="block font-semibold">Something else</span><span class="mt-0.5 block text-sm text-muted-foreground">A club, a cause, a link page or anything else</span></span>
          </label>
        </div>
      </fieldset>
      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center">
        <button type="submit" class="inline-flex h-11 items-center justify-center rounded-md bg-primary px-6 font-semibold text-primary-foreground hover:bg-primary/90 sm:w-auto">Continue</button>
        <a href="new.html" class="inline-flex h-11 items-center justify-center rounded-md px-4 text-sm font-medium text-muted-foreground hover:bg-accent hover:text-foreground">Skip for now</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
