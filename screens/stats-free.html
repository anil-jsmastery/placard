<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor stats (Free)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500..800&family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400..600&display=swap">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<!-- Route: /sites/[id]/stats on Free: total views only, the rest is a locked panel that opens the paywall (reason: stats). The grey bars are a skeleton, not data. -->
<header class="sticky top-0 z-30 border-b border-border bg-card">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-3 px-4 sm:gap-6 sm:px-6">
    <a href="landing.html" class="flex h-10 shrink-0 items-center gap-2 rounded-md font-display text-[17px] font-bold tracking-tight text-foreground focus-visible:outline-2 focus-visible:outline-offset-4" aria-label="Placard home">
  <span class="grid size-7 place-items-center rounded-md bg-primary" aria-hidden="true">
    <svg viewBox="0 0 16 16" class="size-4"><rect x="3" y="3" width="10" height="2.2" rx="1.1" fill="#ffd43b"/><rect x="3" y="6.9" width="7.5" height="2.2" rx="1.1" fill="#fff"/><rect x="3" y="10.8" width="4.8" height="2.2" rx="1.1" fill="#fff" fill-opacity=".55"/></svg>
  </span>
  <span>Placard</span>
</a>

    <nav aria-label="Main" class="flex items-center gap-1 text-sm font-medium">
      <a href="dashboard.html" class="inline-flex h-10 items-center rounded-md px-3 sm:h-8 bg-accent text-foreground">Sites</a>
      <a href="account.html" class="inline-flex h-10 items-center rounded-md px-3 sm:h-8 text-muted-foreground hover:bg-accent hover:text-foreground">Account</a>
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <a href="account.html" class="hidden items-center gap-2.5 rounded-md px-2 py-1.5 text-sm hover:bg-accent sm:flex" aria-label="7 of 10 AI requests left this month">
        <svg class="lucide shrink-0 size-4 text-muted-foreground" data-icon="sparkles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /><path d="M20 2v4" /><path d="M22 4h-4" /><circle cx="4" cy="20" r="2" /></svg>
        <span class="tabular-nums"><span class="font-semibold">7</span><span class="text-muted-foreground"> of 10 AI requests left</span></span>
        <span class="h-1.5 w-14 overflow-hidden rounded-full bg-muted" aria-hidden="true"><span class="block h-full rounded-full bg-primary" style="width: 70%"></span></span>
      </a>
      <a href="pricing.html" class="hidden h-8 sm:inline-flex items-center rounded-md border border-input bg-card px-3 text-sm font-medium hover:bg-accent">Upgrade</a>
      <button type="button" class="grid size-10 place-items-center rounded-full sm:size-8 bg-[#d6dbe5] text-xs font-semibold text-foreground" aria-label="Account menu">AS</button>
    </div>
  </div>
</header>

<div class="border-b border-border bg-card">
  <div class="mx-auto flex max-w-6xl flex-wrap items-end gap-x-6 gap-y-1 px-4 pt-3 sm:px-6 sm:pt-4">
    <div class="mr-auto min-w-0 pb-2">
      <a href="dashboard.html" class="-ml-1 inline-flex h-10 items-center gap-1 px-1 text-sm text-muted-foreground hover:text-foreground"><svg class="lucide shrink-0 size-4" data-icon="chevron-left" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m15 18-6-6 6-6" /></svg>Sites</a>
      <div class="flex items-center gap-3">
        <h1 class="truncate font-display text-2xl font-bold">Ember & Rye</h1>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-live-soft px-2 py-0.5 text-xs font-semibold text-live"><span class="size-1.5 rounded-full bg-live"></span>Live</span>
        
      </div>
    </div>
    <nav aria-label="Site" class="-mb-px flex gap-1 text-sm font-medium">
      <a href="editor.html" class="flex h-11 items-center border-b-2 px-3 border-transparent text-muted-foreground hover:text-foreground">Editor</a>
      <a href="stats.html" class="flex h-11 items-center border-b-2 px-3 border-primary text-foreground">Stats</a>
      <a href="site-settings.html" class="flex h-11 items-center border-b-2 px-3 border-transparent text-muted-foreground hover:text-foreground">Settings</a>
    </nav>
  </div>
</div>

<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
  <dl class="grid gap-4 sm:grid-cols-3">
    <div class="rounded-xl border border-border bg-card p-5"><dt class="text-sm text-muted-foreground">Total views</dt><dd class="mt-2 font-display text-4xl font-bold tabular-nums">1,284</dd><dd class="mt-1 text-sm text-muted-foreground">Since you first published on November 3</dd></div>
  </dl>
  <section class="relative mt-4 overflow-hidden rounded-xl border border-border bg-card" aria-labelledby="lock-h">
    <div class="flex h-56 items-end gap-2 px-8 pt-10 pb-6 opacity-70" aria-hidden="true"><span class="w-full rounded-t-sm bg-muted" style="height:30%"></span><span class="w-full rounded-t-sm bg-muted" style="height:42%"></span><span class="w-full rounded-t-sm bg-muted" style="height:38%"></span><span class="w-full rounded-t-sm bg-muted" style="height:55%"></span><span class="w-full rounded-t-sm bg-muted" style="height:47%"></span><span class="w-full rounded-t-sm bg-muted" style="height:60%"></span><span class="w-full rounded-t-sm bg-muted" style="height:52%"></span><span class="w-full rounded-t-sm bg-muted" style="height:66%"></span><span class="w-full rounded-t-sm bg-muted" style="height:58%"></span><span class="w-full rounded-t-sm bg-muted" style="height:72%"></span><span class="w-full rounded-t-sm bg-muted" style="height:63%"></span><span class="w-full rounded-t-sm bg-muted" style="height:70%"></span><span class="w-full rounded-t-sm bg-muted" style="height:80%"></span><span class="w-full rounded-t-sm bg-muted" style="height:74%"></span><span class="w-full rounded-t-sm bg-muted" style="height:68%"></span><span class="w-full rounded-t-sm bg-muted" style="height:84%"></span><span class="w-full rounded-t-sm bg-muted" style="height:77%"></span><span class="w-full rounded-t-sm bg-muted" style="height:90%"></span></div>
    <div class="absolute inset-0 grid place-items-center bg-card/70 p-6 text-center">
      <div class="max-w-sm">
        <span class="mx-auto grid size-10 place-items-center rounded-full bg-muted"><svg class="lucide shrink-0 size-4" data-icon="lock" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg></span>
        <h2 id="lock-h" class="mt-4 font-semibold">See where your visitors come from</h2>
        <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">Pro shows a 30-day chart of views, your top referrers and phone vs. desktop.</p>
        <button type="button" class="mt-5 inline-flex h-10 items-center rounded-md bg-primary px-4 text-sm font-semibold text-primary-foreground hover:bg-primary/90">Upgrade to Pro</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
